name: WebPage
description: 过滤部分网页广告
author: RuCu6[https://github.com/RuCu6], limbopro[https://github.com/limbopro], ddgksf2013[https://github.com/ddgksf2013], ZenmoFeiShi[https://github.com/ZenmoFeiShi], kokoryh[https://github.com/kokoryh]
homepage: https://github.com/sooyaaabo/Egern
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/Alook.png
dns: {}
rules:
- domain_suffix:
    match: creative.myavlive.com
    policy: REJECT
- domain_suffix:
    match: trackwilltrk.com
    policy: REJECT
- domain_suffix:
    match: tsyndicate.com
    policy: REJECT
- domain_suffix:
    match: jads.co
    policy: REJECT
- domain_suffix:
    match: juicyads.com
    policy: REJECT
- domain_suffix:
    match: mnaspm.com
    policy: REJECT
rewrites:
- match: ^https:\/\/exhentai\.org
  actions:
  - redirect:
      status: 307
      location: https://e-hentai.org
- match: ^https?:\/\/(www.)?(g|google)\.cn
  actions:
  - redirect:
      status: 307
      location: https://www.google.com
- match: ^https?:\/\/translate\.google\.cn
  actions:
  - redirect:
      status: 307
      location: https://translate.google.com
- match: ^https:\/\/(?:cn|www)\.pornhub\.com\/_xa\/ads(_batch)?\?
  actions:
  - respond:
      status: 404
- match: ^https:\/\/asserts\.avple\.tv\/file\/avple-images\/ad\.js
  actions:
  - respond:
      status: 404
